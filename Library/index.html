<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Library</title>
  <link rel="stylesheet" href="wp.css">
</head>
<body>
  <main>
    <header>
      <h1>Library</h1>
      <p>What would you like to do?</p>
    </header>

    <nav class="choices" aria-label="Library options">
      <a class="choice" href="library.html#book-form">
        <span class="num">1</span>
        <span class="label">Add Library</span>
        <span class="hint">Add a new book to your catalogue</span>
      </a>
      <a class="choice" href="library.html#catalogue-heading">
        <span class="num">2</span>
        <span class="label">View Library</span>
        <span class="hint">See everything you've added so far</span>
      </a>
    </nav>
  </main>
</body>
</html>
