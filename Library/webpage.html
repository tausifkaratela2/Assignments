<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Library</title>
  <link rel="stylesheet" href="wp.css">
</head>
<body>
  <main>
    <header>
      <h1>My Library</h1>
      <p>Add the books you own and keep a running catalogue.</p>
    </header>

    <form id="book-form">
      <label for="title">Book title</label>
      <input id="title" name="title" type="text" autocomplete="off" required>

      <label for="author">Author</label>
      <input id="author" name="author" type="text" autocomplete="off" required>

      <button type="submit">Add book</button>
    </form>

    <section aria-labelledby="catalogue-heading">
      <div class="heading-row">
        <h2 id="catalogue-heading">Catalogue</h2>
        <p id="summary">0 books</p>
        <button type="button" id="download" class="link" hidden>Download books.csv</button>
      </div>

      <ol id="book-list"></ol>
      <p id="empty">No books yet. Add your first one above.</p>
    </section>
  </main>

  <script>
    const form = document.getElementById("book-form");
    const list = document.getElementById("book-list");
    const empty = document.getElementById("empty");
    const summary = document.getElementById("summary");
    const download = document.getElementById("download");

    let books = [];
    try {
      books = JSON.parse(localStorage.getItem("books")) || [];
    } catch (e) {
      books = [];
    }

    function render() {
      list.innerHTML = "";
      books.forEach((book) => {
        const li = document.createElement("li");

        const title = document.createElement("span");
        title.className = "title";
        title.textContent = book.title;

        const leader = document.createElement("span");
        leader.className = "leader";
        leader.setAttribute("aria-hidden", "true");

        const author = document.createElement("span");
        author.className = "author";
        author.textContent = book.author;

        li.append(title, leader, author);
        list.appendChild(li);
      });

      summary.textContent = books.length + (books.length === 1 ? " book" : " books");
      empty.hidden = books.length > 0;
      download.hidden = books.length === 0;
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      books.push({
        title: form.title.value.trim(),
        author: form.author.value.trim()
      });
      try {
        localStorage.setItem("books", JSON.stringify(books));
      } catch (e) {}
      form.reset();
      form.title.focus();
      render();
    });

    // Same two-column layout as the Python program's books.csv
    download.addEventListener("click", () => {
      const quote = (text) => '"' + text.replace(/"/g, '""') + '"';
      const csv = books.map((b) => quote(b.title) + "," + quote(b.author)).join("\r\n") + "\r\n";
      const url = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
      const a = document.createElement("a");
      a.href = url;
      a.download = "books.csv";
      a.click();
      URL.revokeObjectURL(url);
    });

    render();
  </script>
</body>
</html>
